[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-tui"
version = "0.1.0"
description = "A sleek, lightning-fast Terminal User Interface (TUI) for real-time Docker & service monitoring"
readme = "README.md"
authors = [
    { name = "Doruk", email = "developer@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["docker", "tui", "monitoring", "terminal", "homelab", "sysadmin", "devops", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=0.70.0",
    "docker>=7.0.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "humanize>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
watchdog = "watchdog_tui.cli:main"
watchdog-tui = "watchdog_tui.cli:main"

[project.urls]
Homepage = "https://github.com/drkkahraman/watchdog"
Repository = "https://github.com/drkkahraman/watchdog"
"Bug Tracker" = "https://github.com/drkkahraman/watchdog/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["watchdog_tui*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
