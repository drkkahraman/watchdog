version: "3.8"

services:
  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchdog
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - TERM=xterm-256color
    restart: unless-stopped
